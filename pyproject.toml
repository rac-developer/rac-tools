[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifloat"
version = "1.0.0"
description = "Lanzador flotante minimalista estilo Spotlight / Raycast para Windows y Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OmniFloat Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Desktop Environment",
    "Topic :: Utilities"
]
dependencies = [
    "PySide6>=6.5.0"
]

[project.optional-dependencies]
linux = [
    "pynput>=1.7.6"
]
build = [
    "pyinstaller>=6.0.0"
]

[project.scripts]
omnifloat = "main:main"

[project.gui-scripts]
omnifloat-gui = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "indexer",
    "launcher_window",
    "hotkey_handler",
    "math_evaluator",
    "settings_window",
    "tray",
    "icon_provider",
    "styles"
]
